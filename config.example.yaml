# yaml-language-server: $schema=./config.schema.json
# Copy this file to config.yaml and select your actual model and endpoint.
# Build model as <LiteLLM integration>/<exact endpoint model ID>, not as a URL.
# Only the first slash separates the integration. Preserve every slash in the
# literal model ID returned by the endpoint's /models response.
# No separate provider field or application aliases are used.
lm:
  # Required: replace this obvious placeholder before starting OGhidra.
  model: replace/provider-and-model-id
  # Set api_base for local or OpenAI-compatible endpoints. Omit it when the
  # provider integration supplies its own endpoint.
  # api_base: http://127.0.0.1:8000/v1
  # If authentication is required, uncomment and set this variable in the
  # environment of the process launched by your MCP client (not just a shell).
  # api_key_env: OGHIDRA_MODEL_API_KEY
  ssl_verify: true
  cache: false
  max_tokens: 4096

# If /models reports the exact ID "openai/gpt-oss-120b":
# Hosted vLLM integration:
#   model: hosted_vllm/openai/gpt-oss-120b
#   api_base: http://127.0.0.1:8000/v1
# Generic OpenAI-compatible integration:
#   model: openai/openai/gpt-oss-120b
#   api_base: http://127.0.0.1:8000/v1
# The shorter openai/gpt-oss-120b is correct only when the endpoint reports
# the exact ID "gpt-oss-120b" without the leading "openai/".
# OpenAI directly:
#   model: openai/gpt-4o
#   api_key_env: OPENAI_API_KEY
#   Omit api_base to use the provider's default endpoint.
# Anthropic directly (Claude):
#   model: anthropic/claude-sonnet-4-5-20250929
#   api_key_env: ANTHROPIC_API_KEY
#   Omit api_base to use the provider's default endpoint.
# Ollama native chat API:
#   model: ollama_chat/llama3.2
#   api_base: http://127.0.0.1:11434
# Replace example model IDs with models available to your installation/account.
# hosted_vllm/ is the hosted server integration.
# api_base is a base URL: do not append /models or /chat/completions.

max_iters: 6

# pyghidra-mcp owns the GUI and serves MCP directly
# Port 8001 avoids the example LM endpoint on port 8000.
mcp_servers:
  ghidra:
    transport: streamable-http
    url: http://127.0.0.1:8001/mcp
    evidence_tools:
      - decompile_function
      - list_xrefs

  # Optional: Obsidian vault integration for persistent function analysis.
  # Install the "Local REST API with MCP" plugin in Obsidian:
  # https://community.obsidian.md/plugins/obsidian-local-rest-api
  # Get your API key from Settings → Local REST API in Obsidian.
  # Note: Use HTTP endpoint (port 27123) to avoid certificate validation issues.
  obsidian:
    transport: streamable-http
    url: http://127.0.0.1:27123/mcp
    # OR use HTTPS after trusting the certificate: https://127.0.0.1:27124/mcp
    headers:
      Authorization: "Bearer your-api-key-from-obsidian-settings"
    vault_path: "C:/path/to/your/ghidra-vault"
    evidence_tools:
      - search_simple
      - vault_read

# Baseline application and MCP diagnostics (stderr + rotating JSON file).
# Relative paths are resolved from this file's directory. Set log_file to null
# to keep stderr logging but disable the JSON file.
log_level: INFO
log_file: logs/oghidra-{timestamp}.jsonl
log_max_bytes: 5000000
log_backup_count: 3
