# yaml-language-server: $schema=./config.schema.json
lm:
  model: claude-sonnet-4.5
  api_base: <URL to your AI server>
  api_key_env: OGHIDRA_MODEL_API_KEY
  cache: false
  max_tokens: 4096

max_iters: 6
log_level: DEBUG

# pyghidra-mcp owns the GUI and serves MCP directly
mcp_servers:
  ghidra:
    transport: streamable-http
    url: http://127.0.0.1:8001/mcp
    evidence_tools:
      - decompile_function
      - list_xrefs
