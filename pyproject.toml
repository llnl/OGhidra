[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oghidra-workflows"
version = "0.2.0"
description = "DSPy reverse-engineering workflows exposed through MCP"
requires-python = ">=3.12"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["dspy[mcp]==3.3.1", "mcp==1.30.0", "pydantic>=2.11,<3", "PyYAML>=6,<7", "python-json-logger>=3,<5", "pyghidra-mcp"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
oghidra-workflows = "oghidra_workflows.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
